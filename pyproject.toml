[project]
name = "frappe-restic"
version = "0.1.0"
description = "Scheduled backups, encrypted Restic snapshots and stopped-service recovery for Frappe"
requires-python = ">=3.10"
authors = [{name = "Grayhat Developers"}]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "frappe_restic"

[tool.bench.frappe-dependencies]
frappe = ">=15.40.4,<17.0.0"
