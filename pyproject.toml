[project]
name = "frappe_restic"
dynamic = ["version"]
description = "Encrypted off-site Restic backups, schedules, alerts and safe container deploys and restores for Frappe"
license = {file = "LICENSE"}
requires-python = ">=3.10"
authors = [{name = "Grayhat Developers"}]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "frappe_restic"

[tool.bench.frappe-dependencies]
frappe = ">=15.40.4,<17.0.0"
