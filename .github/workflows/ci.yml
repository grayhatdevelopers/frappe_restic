name: CI

# Every change reaches develop and main through a pull request, which is where CI runs.
on:
  pull_request:
  workflow_dispatch:

jobs:
  # Documentation-only pull requests skip the tests. The test jobs still run, and pass,
  # so the required checks report.
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      code: ${{ steps.files.outputs.code }}
    steps:
      - id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=true
          if [ -n "$PR" ]; then
              files=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --paginate --jq '.[].filename')
              grep -qvE '\.md$|^docs/|^LICENSE$' <<< "$files" || code=false
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  tests:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Renovate proposes new images within each major (renovate.json).
        include:
          - frappe: v15
            frappe_image: frappe/erpnext:v15.121.3
            db_image: mariadb:10.6
          - frappe: v16
            frappe_image: frappe/erpnext:v16.36.0
            db_image: mariadb:11.8
    # Stable name for required checks, independent of the exact image.
    name: ${{ matrix.frappe }}
    steps:
      - uses: actions/checkout@v7
        if: needs.changes.outputs.code == 'true'
      # bench build writes into the app's public/dist as the image's frappe user (uid 1000).
      - run: chmod -R a+w frappe_restic/public
        if: needs.changes.outputs.code == 'true'
      - name: Tests in a disposable bench
        if: needs.changes.outputs.code == 'true'
        env:
          FRAPPE_IMAGE: ${{ matrix.frappe_image }}
          DB_IMAGE: ${{ matrix.db_image }}
        run: tests/docker/run.sh

  linters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install pre-commit semgrep
      - run: pre-commit run --all-files --show-diff-on-failure
      - name: Frappe's Semgrep rules
        run: |
          git clone --depth 1 https://github.com/frappe/semgrep-rules.git /tmp/frappe-semgrep-rules
          semgrep --error --config /tmp/frappe-semgrep-rules/rules --config r/python.lang.correctness .
