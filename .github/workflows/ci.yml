name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Renovate proposes new images within each major (renovate.json).
        include:
          - frappe: v15
            frappe_image: frappe/erpnext:v15.121.3
            db_image: mariadb:10.6
          - frappe: v16
            frappe_image: frappe/erpnext:v16.36.0
            db_image: mariadb:11.8
    # Stable name for required checks, independent of the exact image.
    name: ${{ matrix.frappe }}
    steps:
      - uses: actions/checkout@v7
      # bench build writes into the app's public/dist as the image's frappe user (uid 1000).
      - run: chmod -R a+w frappe_restic/public
      - name: Tests in a disposable bench
        env:
          FRAPPE_IMAGE: ${{ matrix.frappe_image }}
          DB_IMAGE: ${{ matrix.db_image }}
        run: tests/docker/run.sh
