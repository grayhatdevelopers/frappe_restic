# Disposable bench for tests. Run through tests/docker/run.sh, which picks a
# unique project name and removes containers and volumes afterwards.
services:
  db:
    image: ${DB_IMAGE:-mariadb:10.6}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-frappe-restic-test}
    healthcheck:
      test: [CMD, healthcheck.sh, --connect, --innodb_initialized]
      interval: 2s
      timeout: 5s
      retries: 60

  redis-cache:
    image: redis:6.2-alpine

  redis-queue:
    image: redis:6.2-alpine

  bench:
    image: ${FRAPPE_IMAGE:?FRAPPE_IMAGE is required}
    command: [sleep, infinity]
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started
    environment:
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-frappe-restic-test}
      SITE_NAME: test.localhost
    volumes:
      - ../..:/home/frappe/frappe-bench/apps/frappe_restic
      - sites:/home/frappe/frappe-bench/sites

volumes:
  sites:
